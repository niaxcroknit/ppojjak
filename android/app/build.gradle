plugins { id 'com.android.application' }

android {
    namespace 'com.ppojjak.spaceescape'
    compileSdk 36

    defaultConfig {
        // Play 스토어 앱 ID(패키지명). 이미 Play Console에 이 ID로 올라가 있어서 절대 바꾸면 안 됩니다.
        applicationId 'com.ppojjak.spaceescape'
        minSdk 26 // Android 8.0+ (진동 API·최신 WebView 기준)
        targetSdk 36 // Google Play: 2026-08-31부터 신규 앱·업데이트는 API 36 이상
        versionCode 19 // 올릴 때마다 1씩 올리기 (v0.17)
        versionName '0.18.0'
    }

    // 게임 원본은 저장소 루트의 web/ 폴더 하나뿐입니다. 복사하지 않고 그대로 assets로 묶습니다.
    sourceSets { main { assets.srcDirs = ['../../web'] } }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release { minifyEnabled false }
    }
}

dependencies {
    // FileProvider(결과 화면 캡처 공유)에만 사용
    implementation 'androidx.core:core:1.13.1'
}
